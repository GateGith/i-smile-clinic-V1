<body>
    
<header class="header" role="banner">
    <div class="container header-content">
        <a href="index.html" class="logo-custom" aria-label="I Smile Dental Clinic - Accueil">
            <img src="images/i-smile-logo.png" alt="i-Smile Dental Clinic Logo" class="main-logo-img">
        </a>
        <button class="nav-toggle" id="navToggle" aria-label="Ouvrir le menu" aria-expanded="false" aria-controls="navMenu">
            <i class="fas fa-bars" aria-hidden="true"></i>

        <nav class="nav-menu" id="navMenu" aria-label="Navigation principale">

                <li><a href="index.html#services">Services</a></li>

                <li><a href="contact.html#contact">Contact</a></li>
            </ul>
            <div class="nav-phone-header">
                <a href="tel:+213540992708" aria-label="Appeler le 05 40 99 27 08"><i class="fas fa-phone-alt" aria-hidden="true"></i> 05 40 99 27 08</a>
            </div>
        </nav>
    </div>
</header>

<main id="main-content">
    
<section class="page-hero" style="background: linear-gradient(135deg, #1a3a34 0%, #2d5a52 100%); color: var(--white); padding: 120px 0 60px; text-align: center;">
    <div class="container">
        <h1 style="font-size: clamp(2rem, 4vw, 2.8rem); margin-bottom: 16px; font-weight: 700;">Contact</h1>
        <p style="font-size: 1.1rem; opacity: 0.95; line-height: 1.6;">Prenez rendez-vous ou venez nous rendre visite</p>
    </div>
</section>

<section class="section" id="contact" style="padding: 60px 0;">
    <div class="container">
        <div class="contact-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 32px;">
            <div class="contact-info reveal">
                <h3 style="font-size: 1.5rem; color: var(--marble-green); margin-bottom: 20px; font-weight: 700;">Coordonnées</h3>
                <p style="margin-bottom: 12px; color: var(--grey-text);"><i class="fas fa-map-marker-alt" aria-hidden="true"></i> Dely Ibrahim, Alger</p>
                <p style="margin-bottom: 12px; color: var(--grey-text);"><i class="fas fa-phone" aria-hidden="true"></i> <a href="tel:+213540992708" style="color: var(--teal);">05 40 99 27 08</a></p>
                <p style="margin-bottom: 12px; color: var(--grey-text);"><i class="fab fa-whatsapp" aria-hidden="true"></i> <a href="https://wa.me/213562528806" target="_blank" rel="noopener" style="color: var(--teal);">WhatsApp</a></p>
                <p style="margin-bottom: 12px; color: var(--grey-text);"><i class="fas fa-envelope" aria-hidden="true"></i> <a href="mailto:contact@ismileclinic.com" style="color: var(--teal);">contact@ismileclinic.com</a></p>
                <p style="margin-bottom: 12px; color: var(--grey-text);"><i class="fas fa-clock" aria-hidden="true"></i> 24h/24 - 7j/7</p>
                
                <div class="social-links" style="display: flex; gap: 16px; margin-top: 20px; flex-wrap: wrap;">
                    <a href="https://instagram.com" target="_blank" rel="noopener" class="social-link" aria-label="Instagram" style="width: 44px; height: 44px; border-radius: 50%; background: var(--teal); display: flex; align-items: center; justify-content: center; font-size: 1.3rem; color: var(--white); transition: all 0.2s ease;"><i class="fab fa-instagram" aria-hidden="true"></i></a>
                    <a href="https://facebook.com" target="_blank" rel="noopener" class="social-link" aria-label="Facebook" style="width: 44px; height: 44px; border-radius: 50%; background: var(--teal); display: flex; align-items: center; justify-content: center; font-size: 1.3rem; color: var(--white); transition: all 0.2s ease;"><i class="fab fa-facebook-f" aria-hidden="true"></i></a>
                    <a href="https://tiktok.com" target="_blank" rel="noopener" class="social-link" aria-label="TikTok" style="width: 44px; height: 44px; border-radius: 50%; background: var(--teal); display: flex; align-items: center; justify-content: center; font-size: 1.3rem; color: var(--white); transition: all 0.2s ease;"><i class="fab fa-tiktok" aria-hidden="true"></i></a>
                    <a href="https://maps.google.com" target="_blank" rel="noopener" class="social-link" aria-label="Google Maps" style="width: 44px; height: 44px; border-radius: 50%; background: var(--teal); display: flex; align-items: center; justify-content: center; font-size: 1.3rem; color: var(--white); transition: all 0.2s ease;"><i class="fas fa-map-marker-alt" aria-hidden="true"></i></a>
                    <a href="mailto:contact@ismileclinic.com" class="social-link" aria-label="Gmail" style="width: 44px; height: 44px; border-radius: 50%; background: var(--teal); display: flex; align-items: center; justify-content: center; font-size: 1.3rem; color: var(--white); transition: all 0.2s ease;"><i class="fas fa-envelope" aria-hidden="true"></i></a>
                </div>
            </div>
            
            <div class="contact-form-container reveal">
                <form id="contactForm" class="contact-form" action="https://formspree.io/your-form-id" method="POST" style="background: var(--white); padding: 32px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08);">
                    <input type="hidden" name="_gotcha" class="form-gotcha">
                    <div class="form-group" style="margin-bottom: 20px;">
                        <label for="name" style="display: block; font-weight: 600; margin-bottom: 8px; color: var(--marble-green);">Nom complet</label>
                        <input type="text" id="name" name="name" required autocomplete="name" style="width: 100%; padding: 12px 16px; border: 2px solid #e0e0e0; border-radius: 6px; font-size: 1rem; font-family: inherit; transition: border-color 0.2s ease;">
                    </div>
                    <div class="form-group" style="margin-bottom: 20px;">
                        <label for="email" style="display: block; font-weight: 600; margin-bottom: 8px; color: var(--marble-green);">Email</label>
                        <input type="email" id="email" name="email" required autocomplete="email" style="width: 100%; padding: 12px 16px; border: 2px solid #e0e0e0; border-radius: 6px; font-size: 1rem; font-family: inherit; transition: border-color 0.2s ease;">
                    </div>
                    <div class="form-group" style="margin-bottom: 20px;">
                        <label for="phone" style="display: block; font-weight: 600; margin-bottom: 8px; color: var(--marble-green);">Téléphone</label>
                        <input type="tel" id="phone" name="phone" autocomplete="tel" style="width: 100%; padding: 12px 16px; border: 2px solid #e0e0e0; border-radius: 6px; font-size: 1rem; font-family: inherit; transition: border-color 0.2s ease;">
                    </div>
                    <div class="form-group" style="margin-bottom: 20px;">
                        <label for="message" style="display: block; font-weight: 600; margin-bottom: 8px; color: var(--marble-green);">Message</label>
                        <textarea id="message" name="message" rows="4" required style="width: 100%; padding: 12px 16px; border: 2px solid #e0e0e0; border-radius: 6px; font-size: 1rem; font-family: inherit; transition: border-color 0.2s ease;"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%;">
                        <i class="fas fa-paper-plane" aria-hidden="true"></i> Envoyer
                    </button>
                </form>
            </div>
        </div>
    </div>
</section>

</main>

    <div class="container">
        <div class="footer-content">
            <p class="footer-credit">Website crafted by <a href="https://gategith.github.io/portfolio/" target="_blank" rel="noopener noreferrer" aria-label="Portfolio de REBAS IFILS">REBAS IFILS</a></p>
            <p class="footer-tagline">Digital Experiences</p>
        </div>
    </div>
</footer>

</body>
</html>
